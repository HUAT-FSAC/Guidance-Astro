name: Setup Node & pnpm
description: Checkout + pnpm (from package.json packageManager) + Node 22 (cache pnpm) + pnpm install --frozen-lockfile

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
