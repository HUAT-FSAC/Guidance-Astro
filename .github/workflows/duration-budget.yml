name: Duration Budget

# #229: 每周核对一次 main ci-cd 流水线耗时（TEST_PERF.md 阶段三第 3 项）。
# 采集与判定逻辑在 scripts/quality/check-duration-budget.mjs（只读：gh/REST API 取 run/job/step 时长）。
# 超标时开 [duration-budget] Issue（带 flaky 标签，stale 已豁免该标签 —— #228）。
# 只上报，不自动优化、不自动重跑；已存在 open 的 [duration-budget] Issue 时改为追加评论，避免每周重复开单。
# #242: workflow_dispatch 暴露可选阈值输入，供人工复核超标开单 / 去重路径（留空 = 脚本默认 360s / 90s）。

on:
  schedule:
    - cron: '23 3 * * 1' # 每周一 03:23 UTC（避开整点高峰）
  workflow_dispatch:
    inputs:
      gate-p95-seconds:
        description: '可选：覆盖 Quality 阶段墙钟 P95 阈值（秒）；留空用脚本默认 360'
        required: false
        default: ''
      e2e-step-seconds:
        description: '可选：覆盖 E2E 分片 step 阈值（秒）；留空用脚本默认 90'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  duration-budget:
    name: Check CI duration budget
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Check duration budget
        id: budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # 空串时脚本按默认阈值处理（parseThreshold 忽略空值）；scheduled 运行恒为空串
          DURATION_BUDGET_GATE_P95_S: ${{ inputs.gate-p95-seconds }}
          DURATION_BUDGET_E2E_STEP_S: ${{ inputs.e2e-step-seconds }}
        run: node scripts/quality/check-duration-budget.mjs

      - name: Open duration-budget issue
        if: steps.budget.outputs.exceeded == 'true'
        uses: actions/github-script@v9
        env:
          ISSUE_TITLE: ${{ steps.budget.outputs.issue-title }}
          ISSUE_BODY: ${{ steps.budget.outputs.issue-body }}
        with:
          script: |
            const { owner, repo } = context.repo
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => !issue.pull_request && issue.title.startsWith('[duration-budget]'))
            if (existing) {
              const body = ['本周复查仍超标（沿用既有 Issue 追踪，不重复开单）。', '', process.env.ISSUE_BODY].join('\n')
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body })
              return
            }
            await github.rest.issues.create({
              owner,
              repo,
              title: process.env.ISSUE_TITLE,
              body: process.env.ISSUE_BODY,
              labels: ['flaky', 'area:quality', 'area:devops', 'type:task'],
            })
