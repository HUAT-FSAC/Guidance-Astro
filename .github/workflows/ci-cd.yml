name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Check theme text contrast tokens
        run: pnpm quality:theme

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Run type check
        run: pnpm exec tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Build project
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  quality-gate:
    name: Quality Gate (E2E/LHCI/Budget)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run bundle budget check
        run: pnpm quality:bundle

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify dist contents
        run: |
          echo "Current directory: $(pwd)"
          echo "Dist directory listing:"
          ls -la dist/client/ | head -n 20
          echo "---"
          ls -la dist/server/ | head -n 10
          test -f dist/server/entry.mjs && echo "dist/server/entry.mjs exists" || echo "dist/server/entry.mjs MISSING"
        shell: bash

      - name: Run E2E tests (full suite)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
          PLAYWRIGHT_REUSE_SERVER: 'false'
          PLAYWRIGHT_WEB_SERVER_COMMAND: 'pnpm preview:ssr'
        run: pnpm exec playwright test --config=.config/playwright.config.ts

      - name: Run Lighthouse CI
        run: |
          pnpm dlx @lhci/cli@0.15.1 collect --config=.config/lighthouserc.json
          pnpm dlx @lhci/cli@0.15.1 assert --config=.config/lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [build, quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://huat-fsac.eu.org
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify dist for deploy
        run: |
          test -f dist/server/entry.mjs || (echo "Missing dist/server/entry.mjs" && exit 1)
          test -f dist/server/wrangler.json || (echo "Missing dist/server/wrangler.json" && exit 1)
          echo "Deploy artifacts ready"
          ls -lh dist/server/entry.mjs dist/server/wrangler.json
        shell: bash

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment (CSP nonce)
        run: |
          sleep 8
          echo "Checking https://huat-fsac.eu.org/ headers..."
          curl -sI https://huat-fsac.eu.org/ || true
          echo "--- HTML nonce check ---"
          curl -s https://huat-fsac.eu.org/ | grep -o 'nonce-[^"]*' | head -n 5 || echo "no nonce in HTML (may be expected if not yet deployed)"
        shell: bash

  preview:
    name: Preview Build
    runs-on: ubuntu-latest
    needs: [build, quality-gate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run bundle budget check
        run: pnpm quality:bundle

      - name: Check dist contents
        run: |
          echo "Dist directory contents:"
          ls -la dist/client/
          echo "---"
          ls -la dist/server/
          test -f dist/server/entry.mjs || (echo "Missing dist/server/entry.mjs" && exit 1)
          test -f dist/server/wrangler.json || (echo "Missing dist/server/wrangler.json" && exit 1)
          echo "Build artifacts look good"
        shell: bash
