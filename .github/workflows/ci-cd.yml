name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

# P0-5: 同分支新提交自动取消旧构建，同分支多次 push 不再全量跑完
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint and Format
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Run ESLint
              run: pnpm lint

            - name: Check theme text contrast tokens
              run: pnpm quality:theme

            - name: Check formatting
              run: pnpm format:check

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Run type check
              run: pnpm exec tsc --noEmit

    test:
        name: Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Run tests
              run: pnpm test:coverage

            - name: Upload coverage
              uses: codecov/codecov-action@v7
              continue-on-error: true
              with:
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}

    audit:
        name: Audit Dependencies
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Run audit gate
              # #173: pnpm audit @ moderate + 带到期日的显式豁免清单（.config/audit-allowlist.json）。
              # 未知公告仍失败；条目到期也失败。级别与旧行为一致。
              run: pnpm quality:audit

    build:
        name: Build
        runs-on: ubuntu-latest
        # P0-6: 只等测试与类型（构建输入），lint/audit 并行跑但不阻塞构建
        needs: [test, typecheck]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Build project
              run: pnpm build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  retention-days: 7

    # P0-1: 原 quality-gate 单 job 串行（bundle+routes+E2E+LHCI 共 299s）拆为三并行 job，
    # 耗时取 max 而非 sum；末尾 quality-gate 聚合 job 保留 job id（分支保护 required check）。
    quality-budget:
        name: Quality Budget
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Run bundle budget check
              run: pnpm quality:bundle

            - name: Run route-level budget check
              run: pnpm quality:routes

    quality-e2e:
        name: Quality E2E
        runs-on: ubuntu-latest
        needs: build
        # P0-2: E2E 二分片并行（67s -> 约 35s）；fail-fast:false 让两分片独立上报
        strategy:
            fail-fast: false
            matrix:
                shard: ['1/2', '2/2']

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            # P0-3: 缓存 Playwright 浏览器（~150MB），命中时 install 约 2s（原 19s）
            # key 绑定 chromium 版本，升级 Playwright 时同步改 key 后缀
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-chromium-1243
                  restore-keys: |
                      ${{ runner.os }}-playwright-

            - name: Install Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Verify dist contents
              run: |
                  echo "Current directory: $(pwd)"
                  echo "Dist directory listing:"
                  ls -la dist/client/ | head -n 20
                  echo "---"
                  ls -la dist/server/ | head -n 10
                  test -f dist/server/entry.mjs && echo "dist/server/entry.mjs exists" || echo "dist/server/entry.mjs MISSING"
              shell: bash

            # P0-7: smoke 先行 fast-fail——冒烟失败则本分片直接停止，不跑全量
            - name: Run E2E smoke (fast-fail)
              env:
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
                  PLAYWRIGHT_REUSE_SERVER: 'false'
                  PLAYWRIGHT_WEB_SERVER_COMMAND: 'pnpm preview:ssr'
              run: pnpm exec playwright test smoke.spec.ts --config=.config/playwright.config.ts

            - name: Run E2E tests (shard ${{ matrix.shard }})
              env:
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
                  PLAYWRIGHT_REUSE_SERVER: 'false'
                  PLAYWRIGHT_WEB_SERVER_COMMAND: 'pnpm preview:ssr'
              run: pnpm exec playwright test --config=.config/playwright.config.ts --shard=${{ matrix.shard }}

    quality-lhci:
        name: Quality LHCI
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            # LHCI 分档：PR 只跑首页 1 URL x 1 次（约 15~30s），main/push 全量 4 URL x 3 次
            - name: Run Lighthouse CI (PR fast lane)
              if: github.event_name == 'pull_request'
              run: |
                  pnpm dlx @lhci/cli@0.15.1 collect --config=.config/lighthouserc.pr.json
                  pnpm dlx @lhci/cli@0.15.1 assert --config=.config/lighthouserc.pr.json
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

            - name: Run Lighthouse CI (full suite)
              if: github.event_name != 'pull_request'
              run: |
                  pnpm dlx @lhci/cli@0.15.1 collect --config=.config/lighthouserc.json
                  pnpm dlx @lhci/cli@0.15.1 assert --config=.config/lighthouserc.json
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    # 聚合 job：job id 必须保持 quality-gate（分支保护 required check context），
    # 本身不跑测试，只等三个并行 job 全绿。
    quality-gate:
        name: Quality Gate (E2E/LHCI/Budget)
        runs-on: ubuntu-latest
        needs: [quality-budget, quality-e2e, quality-lhci]

        steps:
            - name: Aggregate quality results
              run: echo "quality-budget / quality-e2e / quality-lhci all passed"

    # #228: quality-e2e / quality-lhci 失败时自动开 flaky-candidate Issue(只上报,不处置)。
    # 新增 job,不改既有 job id 与 quality-gate 的 needs,分支保护上下文不受影响。
    report-flaky:
        name: Report flaky candidate
        if: failure() && (needs.quality-e2e.result == 'failure' || needs.quality-lhci.result == 'failure')
        needs: [quality-e2e, quality-lhci]
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: Open flaky-candidate issue
              uses: actions/github-script@v9
              env:
                  E2E_RESULT: ${{ needs.quality-e2e.result }}
                  LHCI_RESULT: ${{ needs.quality-lhci.result }}
              with:
                  script: |
                      const failed = []
                      if (process.env.E2E_RESULT === 'failure') failed.push('quality-e2e')
                      if (process.env.LHCI_RESULT === 'failure') failed.push('quality-lhci')
                      const { owner, repo } = context.repo
                      const title = `[flaky-candidate] ${failed.join(' + ')} 失败(run ${context.runId})`
                      const body = [
                          'quality 链路失败自动上报 — 可能是 flaky 抖动,也可能是真实回归,请人工研判。',
                          '',
                          `失败 job: ${failed.join(', ')}`,
                          `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                          `- Commit: ${context.sha}`,
                          `- 分支: ${context.ref}`,
                          '',
                          '研判为抖动:关闭本 Issue(重跑已绿即可);研判为回归:转正式任务单跟进。',
                          '本 Issue 带 `flaky` 标签,不受 stale 自动关闭打扰。',
                      ].join('\n')
                      await github.rest.issues.create({ owner, repo, title, body, labels: ['flaky', 'area:quality', 'area:devops', 'type:task'] })

    # deploy job 已于 2026-09-19 移出 CI:Cloudflare API Token Secret 暂不配置,
    # 留在流水线里只会让每次 push 的 main 长红。线上部署改由 Agent/维护者在
    # 本机执行 `pnpm deploy:worker`(wrangler OAuth),命令与验收见 docs/DEPLOYMENT.md。
    preview:
        name: Preview Build
        runs-on: ubuntu-latest
        # P0-4: 只等 build，与 quality 链路并行；bundle 检查 quality-budget 已跑过，不重复
        needs: [build]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node & pnpm
              uses: ./.github/actions/setup

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist

            - name: Check dist contents
              run: |
                  echo "Dist directory contents:"
                  ls -la dist/client/
                  echo "---"
                  ls -la dist/server/
                  test -f dist/server/entry.mjs || (echo "Missing dist/server/entry.mjs" && exit 1)
                  test -f dist/server/wrangler.json || (echo "Missing dist/server/wrangler.json" && exit 1)
                  echo "Build artifacts look good"
              shell: bash
