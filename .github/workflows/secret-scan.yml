name: Secret Scan (gitleaks)

# CI 兜底 — 即使开发者本地没装 gitleaks,这里也会扫。
# 同时扫描:历史 commit + 当前工作树 + PR diff。
# 任何"已 push 到 origin"的高置信度密钥,直接 fail。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 UTC 02:00(北京时间 10:00)对全 history 扫一次,防漏网
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # 用于自动开 issue(发现已泄露时)
  issues: write

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    outputs:
      leaks-found: ${{ steps.evaluate.outputs.leaks-found }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全 history,才能扫到老 commit

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.22.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        id: scan
        # continue-on-error:由后一步 Evaluate 按 JSON 报告判定是"真检出"还是"infra 失败",
        # 避免安装失败/网络失败误触发 P0 泄露告警(见 Issue#42 误报)。
        continue-on-error: true
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner --report-format json --report-path gitleaks-findings.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate findings
        id: evaluate
        if: always()
        run: |
          if [ -f gitleaks-findings.json ] && [ "$(jq 'length' gitleaks-findings.json 2>/dev/null || echo 0)" != "0" ]; then
            echo "leaks-found=true" >> "$GITHUB_OUTPUT"
            echo "🔴 gitleaks 报告检出,见 artifact gitleaks-findings"
          else
            echo "leaks-found=false" >> "$GITHUB_OUTPUT"
            echo "✅ 无检出(或扫描 infra 失败,见上一步日志)"
          fi

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks-findings.json
          if-no-files-found: warn

      - name: Fail on leaks
        if: steps.evaluate.outputs.leaks-found == 'true'
        run: |
          echo "::error::gitleaks 发现高置信度密钥,已开 P0 issue 跟踪"
          exit 1

  # 只有 gitleaks 真检出时才开 issue；安装/网络等 infra 失败只让工作流变红,不误报"泄露"
  report-leak:
    name: Report leak (push only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gitleaks.outputs.leaks-found == 'true'
    needs: gitleaks
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open leak report issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const title = '🔴 gitleaks 在 main 分支检测到疑似密钥泄露'
            const body = [
              '`gitleaks` 在 main 分支扫描失败 — 可能存在已 push 的高置信度密钥。',
              '',
              '请立即:',
              '1. 撤销/轮换相关凭据(Cloudflare / GitHub / Webhook 等)',
              '2. 使用 `git filter-repo` 或 BFG 清理历史',
              '3. 在本 Issue 评论处理结果',
              '',
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              '',
              '> 误报请在本 Issue 评论 `false-positive`,维护者会调整 `.gitleaks.toml`。',
            ].join('\n')
            await github.rest.issues.create({ owner, repo, title, body, labels: ['area:devops', 'priority:p0', 'risk:blocker', 'security'] })
