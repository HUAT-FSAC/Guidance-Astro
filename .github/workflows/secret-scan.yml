name: Secret Scan (gitleaks)

# CI 兜底 — 即使开发者本地没装 gitleaks,这里也会扫。
# 同时扫描:历史 commit + 当前工作树 + PR diff。
# 任何"已 push 到 origin"的高置信度密钥,直接 fail。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 UTC 02:00(北京时间 10:00)对全 history 扫一次,防漏网
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # 用于自动开 issue(发现已泄露时)
  issues: write

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全 history,才能扫到老 commit

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.22.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 如果 push 到 main 的扫描发现高置信度 secret,开 issue 提醒
  report-leak:
    name: Report leak (push only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && failure()
    needs: gitleaks
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open leak report issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const title = '🔴 gitleaks 在 main 分支检测到疑似密钥泄露'
            const body = [
              '`gitleaks` 在 main 分支扫描失败 — 可能存在已 push 的高置信度密钥。',
              '',
              '请立即:',
              '1. 撤销/轮换相关凭据(Cloudflare / GitHub / Webhook 等)',
              '2. 使用 `git filter-repo` 或 BFG 清理历史',
              '3. 在本 Issue 评论处理结果',
              '',
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              '',
              '> 误报请在本 Issue 评论 `false-positive`,维护者会调整 `.gitleaks.toml`。',
            ].join('\n')
            await github.rest.issues.create({ owner, repo, title, body, labels: ['area:devops', 'priority:p0', 'risk:blocker', 'security'] })
