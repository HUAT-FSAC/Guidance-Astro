name: Close Stale Issues / PRs

# 30 天无活动 → 打 stale 标签 + 留评论;
# 再 7 天无活动 → 自动关闭。
# 仅作用于我们显式指定的 label,避免误伤维护者正在跟进的项。

on:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 03:00 / 北京时间 11:00
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # --- Issues ---
      - name: Stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: |
            👋 这条 Issue 已经 30 天没有活动了。
            如果仍然需要处理,请回复 / 移除 `stale` 标签,我们会继续跟进;
            否则会在 7 天后自动关闭,届时可以随时重新打开。
          close-issue-message: |
            🔒 由于持续无活动,本 Issue 已被自动关闭。
            仍需讨论?直接重新打开(reopen)即可。
          stale-issue-label: stale
          exempt-issue-labels: |
            priority:p0
            status:review
            area:devops
            good first issue
            help wanted
          # --- PRs ---
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-message: |
            👋 这条 PR 45 天没有活动。
            如果还在进行中,请 push 或评论以保持活跃;
            否则 14 天后会关闭(可重新打开)。
          close-pr-message: |
            🔒 由于持续无活动,本 PR 已被自动关闭。
          stale-pr-label: stale
          exempt-pr-labels: |
            status:review
            area:devops
            work-in-progress
          # 不去戳锁定的、里程碑里的
          only: issues
          operations-per-run: 50
