name: Release Please

# release-please 由 googleapis 维护,基于 Conventional Commits 自动:
# 1) 维护 CHANGELOG.md(已存在 → 追加,不存在 → 由它创建)
# 2) bump package.json / wrangler.json / 任意 release-as 配置的版本号
# 3) 创建一个 "Release PR",合入后自动打 tag + 写 GitHub Release
#
# 首次运行会创建一个 "chore(main): release 0.0.1" 的初始化 PR,
# 接受它之后即开始按提交生成 Release。
#
# ── 权限现状（2026-09-22 终局，T-021 闭环）────────────────────────────────
# 人类已在 Org Settings → Actions → General 勾选 "Allow GitHub Actions to
# create and approve pull requests"：仓库 `can_approve_pull_request_reviews`
# false→true（A/B 翻转实证），内置 GITHUB_TOKEN 可建 PR。
#
# e2e 铁证：未配置 RELEASE_PLEASE_TOKEN（secret 仅 CODECOV/PROJECT）的前提下，
# rp 于 2026-09-22 自动创建 PR #96（作者 github-actions[bot]）；#85 已合并。
# 旧 A1(PAT)/A2(App)/B(去 PR 化)/C(无凭据应急)四路线全部归档作废，
# 发版回归全自动（push → rp 自开 PR → 人类点 merge → tag/Release）。
#
# 详见 docs/WORKFLOW.md §4 T-021 / §7.4 2026-09-22 两行

on:
  push:
    branches: [main]
  # 手动验证通道(修 Issue#43~52 后用,无需空提交触发)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # 优先用 PAT / GitHub App 令牌；未配置时回落 GITHUB_TOKEN。
          #（组织闸已于 2026-09-22 打开，回落 GITHUB_TOKEN 同样可建 PR，见文件头）。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node

      - name: Log release result
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "✅ Release created: ${{ steps.release.outputs.tag_name }}"
          echo "📦 Assets: ${{ steps.release.outputs.upload_url }}"

  # ──────────────────────────────────────────────────────────────────────
  # release-please 合入 tag 后,自动构建并发布 npm prerelease
  # 当前仓库是 private,没有 publish 流程,只做镜像/通知
  # 如未来要 publish,加 publish-npm job 即可
  # ──────────────────────────────────────────────────────────────────────

  # 失败/异常通过 GitHub Issue 报告
  notify-failure:
    name: Notify Release Failure
    if: failure()
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const title = `⚠️ release-please failed on ${context.sha.slice(0, 7)}`
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const existing = open.find((i) => i.title.startsWith('⚠️ release-please failed'))
            if (existing) {
              console.log(`Existing open failure issue #${existing.number}; skipping duplicate.`)
              return
            }
            const body = [
              '`release-please` 工作流失败,可能影响 Release PR 正常生成。',
              '',
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              '',
              '请维护者检查日志。',
            ].join('\n')
            await github.rest.issues.create({ owner, repo, title, body, labels: ['area:devops', 'priority:p1'] })
