name: Release Please

# release-please 由 googleapis 维护,基于 Conventional Commits 自动:
# 1) 维护 CHANGELOG.md(已存在 → 追加,不存在 → 由它创建)
# 2) bump package.json / wrangler.json / 任意 release-as 配置的版本号
# 3) 创建一个 "Release PR",合入后自动打 tag + 写 GitHub Release
#
# 首次运行会创建一个 "chore(main): release 0.0.1" 的初始化 PR,
# 接受它之后即开始按提交生成 Release。
#
# ── 权限现状（2026-09-19，T-021）────────────────────────────────────────
# 组织 HUAT-FSAC **未开启** "Allow GitHub Actions to create and approve pull
# requests"，且该开关是组织级锁定（仓库级 PUT 返回 409，仓库无法自行覆盖）。
#
# 关键点：它只约束工作流内置的 GITHUB_TOKEN，并不禁止自动化建 PR。
# 因此下列替代路线均不需要动组织规则（按推荐度排序）：
#
#   A2 GitHub App（长期推荐）
#      建一个 GitHub App 安装到本仓，权限 Contents:RW + Pull requests:RW
#      + Issues:RW，再用 actions/create-github-app-token 在 job 内铸短时令牌。
#      优点：无个人身份、令牌自动轮转、可单独吊销。
#
#   A1 细粒度 PAT（最快）
#      仅授权本仓 Contents:RW + Pull requests:RW + Issues:RW 的 fine-grained
#      PAT，存为仓库 secret RELEASE_PLEASE_TOKEN —— 本文件已自动优先使用它，
#      无需改代码。
#      ⚠️ 轮换提醒：细粒度 PAT 最长 1 年到期，到期后 Release PR 会静默失败。
#         建/换 token 时把到期日回写到 docs/WORKFLOW.md §4 T-021 一栏。
#
#   C  无凭据应急（当前状态）
#      没有 PAT/App 时，rp 用 GITHUB_TOKEN 仍能推 release 分支、**更新已有**
#      Release PR、打 tag、发 Release；唯独"新建 PR"被 403。
#      ⇒ 因此 #85 必须保持 open：一旦合并或关闭，下一张 Release PR 无法自动
#        生成，需由维护者用已登录的 `gh pr create` 补建（runbook 见
#        docs/WORKFLOW.md §4 T-021）。
#
# 详见 docs/WORKFLOW.md §4 T-021 / docs/PROJECT_MANAGEMENT_MODEL.md

on:
  push:
    branches: [main]
  # 手动验证通道(修 Issue#43~52 后用,无需空提交触发)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # 用于 provenance 签名(可选)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # 优先用 PAT / GitHub App 令牌；未配置时回落 GITHUB_TOKEN。
          # 回落态只能"更新"已存在的 Release PR，不能"新建"（组织策略限制），
          # 报错形如 "GitHub Actions is not permitted to create or approve
          # pull requests" —— 见文件头 T-021 说明。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node

      - name: Log release result
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "✅ Release created: ${{ steps.release.outputs.tag_name }}"
          echo "📦 Assets: ${{ steps.release.outputs.upload_url }}"

  # ──────────────────────────────────────────────────────────────────────
  # release-please 合入 tag 后,自动构建并发布 npm prerelease
  # 当前仓库是 private,没有 publish 流程,只做镜像/通知
  # 如未来要 publish,加 publish-npm job 即可
  # ──────────────────────────────────────────────────────────────────────

  # 失败/异常通过 GitHub Issue 报告
  notify-failure:
    name: Notify Release Failure
    if: failure()
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const title = `⚠️ release-please failed on ${context.sha.slice(0, 7)}`
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const existing = open.find((i) => i.title.startsWith('⚠️ release-please failed'))
            if (existing) {
              console.log(`Existing open failure issue #${existing.number}; skipping duplicate.`)
              return
            }
            const body = [
              '`release-please` 工作流失败,可能影响 Release PR 正常生成。',
              '',
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              '',
              '请维护者检查日志。',
            ].join('\n')
            await github.rest.issues.create({ owner, repo, title, body, labels: ['area:devops', 'priority:p1'] })
