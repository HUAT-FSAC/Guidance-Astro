name: First-time Contributor Welcome

# 首次为仓库贡献的 PR/Issue 作者:发一条欢迎评论,附贡献指南与行为准则。
# 行为完全被动(只对 *first* interaction 触发),不抢维护者注意力。

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    name: Say hi
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check first-time contributor & post welcome
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 感谢第一次提 Issue!

            几个能帮你更快得到回复的小贴士:

            - 📖 仓库文档:[README](../blob/main/README.md) · [CONTRIBUTING](../blob/main/CONTRIBUTING.md) · [SUPPORT](../blob/main/SUPPORT.md)
            - 🛡️ **安全相关请用 [私有 Advisory](https://github.com/HUAT-FSAC/Guidance-Astro/security/advisories/new)**,不要在此公开提
            - 🤝 社区守则:[CODE_OF_CONDUCT](../blob/main/CODE_OF_CONDUCT.md)
            - 💬 想法 / Q&A 优先走 [Discussions](https://github.com/HUAT-FSAC/Guidance-Astro/discussions),Issue 只留任务/缺陷

            我们是学生车队业余维护,尽量 7 天内回复,见谅。
          pr-message: |
            👋 感谢第一次提 PR!

            提 PR 前请确认:

            - ✅ 已阅读 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)
            - ✅ 提交信息遵循 [Conventional Commits](https://www.conventionalcommits.org/)(`feat: ...` / `fix: ...`)
            - ✅ 通过 [`docs/WORKFLOW.md §6` 质量门禁](../blob/main/docs/WORKFLOW.md):
              `pnpm lint` · `pnpm format:check` · `pnpm test:run` · `pnpm build`
            - ✅ 已在 PR 描述里粘贴关键日志/截图
            - 🤝 行为守则:[CODE_OF_CONDUCT.md](../blob/main/CODE_OF_CONDUCT.md)

            维护者会在 CI 绿后 Review,可能要求小幅调整。谢谢 🙏
